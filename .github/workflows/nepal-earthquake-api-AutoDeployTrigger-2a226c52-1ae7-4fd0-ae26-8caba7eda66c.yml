name: Trigger auto deployment for nepal-earthquake-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/nepal-earthquake-api-AutoDeployTrigger-2a226c52-1ae7-4fd0-ae26-8caba7eda66c.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NEPALEARTHQUAKEAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NEPALEARTHQUAKEAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NEPALEARTHQUAKEAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}"./Dockerfile"
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: githubnepalearthquakeapi.azurecr.io
          registryUsername: ${{ secrets.NEPALEARTHQUAKEAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.NEPALEARTHQUAKEAPI_REGISTRY_PASSWORD }}
          containerAppName: nepal-earthquake-api
          resourceGroup: MLgroup
          imageToBuild: githubnepalearthquakeapi.azurecr.io/nepal-earthquake-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


