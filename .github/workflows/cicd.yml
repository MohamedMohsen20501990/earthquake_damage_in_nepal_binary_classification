name: ci/cd_earthquake_nepal_api

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code from repo
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: run tests
        env:
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: pytest

  build-and-publish:
    needs: build-and-test
    runs-on:  ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: login to docker Hub
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: build and push docker image
        id: build-and-publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nepal_earthquake_api:latest
            ${{ secrets.DOCKER_USERNAME }}/nepal_earthquake_api:${{ github.sha }}
      - name: Image digest
        run: echo ${{ steps.build-and-publish.outputs.digest}}

  deploy-to-azure:
 
    needs: build-and-publish
    runs-on: ubuntu-latest

    steps:

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: nepal-earthquake-api
          resourceGroup: MLgroup
          imageToDeploy: docker.io/${{ secrets.DOCKER_USERNAME }}/nepal_earthquake_api:${{ github.sha }}
          registryUrl: docker.io
          registryUsername: ${{ secrets.DOCKER_USERNAME }}
          registryPassword: ${{ secrets.DOCKER_TOKEN }}      

